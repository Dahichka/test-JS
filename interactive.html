<!DOCTYPE html>
<html>
<head>
    <title>Playing with a DOM</title>
</head>


<body>
    <h1 id="heading">Hello world!</h1>

    <script src="https://code.jquery.com/jquery-2.1.0.js"></script>
    <script>
        var left0ffset = 0;
        var moveHeading = function () {
            $("#heading").offset({left: left0ffset});
            left0ffset++;
            if(left0ffset > 200){
                left0ffset = 0;
            }
        };
        setInterval(moveHeading, 30);
    </script>
</body>

</html>
